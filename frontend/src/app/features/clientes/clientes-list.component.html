<div class="maia-page">
  <h1>Clientes</h1>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="clientes()" class="mat-elevation-z1" style="width: 100%">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="pasta_sharepoint_id">
          <th mat-header-cell *matHeaderCellDef>Pasta SharePoint</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.pasta_sharepoint_id }}</td>
        </ng-container>

        <ng-container matColumnDef="criado_em">
          <th mat-header-cell *matHeaderCellDef>Criado em</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.criado_em | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let cliente">
            <a mat-button color="primary" [routerLink]="['/clientes', cliente.id, 'processos']">Processos</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    </mat-card-content>
  </mat-card>

  <mat-card style="margin-top: 16px">
    <mat-card-title>Novo cliente</mat-card-title>
    <mat-card-content>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Nome</mat-label>
        <input matInput [(ngModel)]="novoNome" name="nome" />
      </mat-form-field>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>ID da pasta no SharePoint</mat-label>
        <input matInput [(ngModel)]="novaPastaSharepointId" name="pastaSharepointId" />
      </mat-form-field>
      @if (erro) {
        <p style="color: #b3261e">{{ erro }}</p>
      }
      <button mat-flat-button color="primary" [disabled]="salvando" (click)="criar()">Adicionar cliente</button>
    </mat-card-content>
  </mat-card>
</div>
