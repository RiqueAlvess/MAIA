<div class="maia-page">
  <h1>Processos</h1>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="processos()" class="mat-elevation-z1" style="width: 100%">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let processo">{{ processo.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="status_as_is">
          <th mat-header-cell *matHeaderCellDef>Status AS IS</th>
          <td mat-cell *matCellDef="let processo">{{ processo.status_as_is }}</td>
        </ng-container>

        <ng-container matColumnDef="status_to_be">
          <th mat-header-cell *matHeaderCellDef>Status TO BE</th>
          <td mat-cell *matCellDef="let processo">{{ processo.status_to_be }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let processo">
            <a mat-button color="primary" [routerLink]="['/processos', processo.id, 'entregaveis']">Entregáveis</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      </table>
    </mat-card-content>
  </mat-card>

  <mat-card style="margin-top: 16px">
    <mat-card-title>Novo processo</mat-card-title>
    <mat-card-content>
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Nome do processo</mat-label>
        <input matInput [(ngModel)]="novoNome" name="nome" />
      </mat-form-field>
      @if (erro) {
        <p style="color: #b3261e">{{ erro }}</p>
      }
      <button mat-flat-button color="primary" [disabled]="salvando" (click)="criar()">Adicionar processo</button>
    </mat-card-content>
  </mat-card>
</div>
